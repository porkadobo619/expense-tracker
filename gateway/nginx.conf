server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://expense-service:8000/;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_down;
    }

    location /docs {
        proxy_pass http://expense-service:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://expense-service:8000/openapi.json;
    }

    location @service_down {
        default_type application/json;
        return 503 '{"error":"service_unavailable","detail":"Expense service is not reachable."}';
    }
}
