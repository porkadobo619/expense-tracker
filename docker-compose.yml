services:
  expense-service:
    build: ./expense-service
    environment:
      EXPENSE_DB_PATH: /data/expense_tracker.db
    volumes:
      - expense-data:/data

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/pwa:/usr/share/nginx/html:ro
    depends_on:
      expense-service:
        condition: service_healthy

volumes:
  expense-data:
